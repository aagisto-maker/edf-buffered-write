[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edf-buffered-write"
version = "2.4.0"
description = "A buffer-then-flush EDF/EDF+ writer and a library-independent round-trip integrity test for real-time biopotential streaming."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ángel Agis-Torres", email = "aagisto@ucm.es" }]
keywords = [
    "EDF",
    "EDF+",
    "pyedflib",
    "electromyography",
    "biopotential acquisition",
    "data integrity",
    "reproducibility",
]
dependencies = ["numpy", "pyedflib"]

[project.optional-dependencies]
# Extra libraries needed only to reproduce the characterisation harness/figures.
repro = ["scipy", "matplotlib", "EDFlib-Python", "edfio"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/aagisto-maker/edf-buffered-write"
Archive = "https://doi.org/10.5281/zenodo.21163099"

[tool.setuptools]
# The reusable library is the edf_buffered_write package; the scripts at the
# repository root (harness, figure generators, tests) are reproducibility
# material and are run in place rather than installed.
packages = ["edf_buffered_write"]
